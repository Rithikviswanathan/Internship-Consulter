<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Assistant Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-content">
                <div class="bot-avatar">
                    <i class="fas fa-robot"></i>
                    <span class="status-dot"></span>
                </div>
                <div class="header-info">
                    <h2>InternBot</h2>
                    <span class="status-text">Online • Ready to help</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="clearChat" title="Clear chat">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-messages" id="chatMessages">
            <!-- Welcome Message -->
            <div class="message bot-message">
                <div class="message-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="message-content">
                    <div class="message-bubble">
                        <p>Hello! I'm your Internship Assistant! 🎓</p>
                        <p>I can help you with tasks, skills, networking, feedback, and challenges during your internship. What would you like to know?</p>
                    </div>
                    <span class="message-time">Just now</span>
                </div>
            </div>
        </div>

        <!-- Quick Replies -->
        <div class="quick-replies" id="quickReplies">
            <button class="quick-btn" data-message="How to manage tasks?">📋 Tasks</button>
            <button class="quick-btn" data-message="What skills to develop?">💪 Skills</button>
            <button class="quick-btn" data-message="How to network?">🤝 Network</button>
            <button class="quick-btn" data-message="How to ask for feedback?">📝 Feedback</button>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Type your message..." autocomplete="off">
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Typing Indicator (Hidden by default) -->
    <div class="typing-indicator" id="typingIndicator" style="display: none;">
        <div class="message-avatar">
            <i class="fas fa-robot"></i>
        </div>
        <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
